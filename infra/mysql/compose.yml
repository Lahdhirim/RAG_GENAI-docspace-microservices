services:
  db:
    image: mysql
    restart: always
    env_file: 
      - ../.env
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
  admin:
    image: phpmyadmin
    restart: always
    environment:
      - PMA_ARBITRARY=1
    ports:
      - 8080:80
    depends_on:
      - db
volumes:
  db-data: