services:
  db:
    image: mysql
    restart: always
    env_file:
      - ./.env
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql -h 127.0.0.1 -u root -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  admin:
    image: phpmyadmin
    restart: always
    environment:
      - PMA_ARBITRARY=1
    ports:
      - "8080:80"
    depends_on:
      - db

  doc_manager_api:
    build:
      context: .
      dockerfile: src/services/doc_manager_service/Dockerfile
    restart: always
    environment:
      - ENV=production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m database.tables && exec uvicorn app:app --host 0.0.0.0 --port 8000"]
    env_file:
      - ./.env
    volumes:
      - ./data:/app/data

  doc_manager_worker:
    build:
      context: .
      dockerfile: src/services/doc_manager_service/Dockerfile
    restart: always
    environment:
      - ENV=production
    command: ["python", "worker.py"]
    depends_on:
      db:
        condition: service_healthy
      parsing_api:
        condition: service_started
    env_file:
      - ./.env
    volumes:
      - ./data:/app/data

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  parsing_api:
    build:
      context: .
      dockerfile: src/services/parser_service/Dockerfile.api
    restart: always
    environment:
      - ENV=production
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  parsing_worker:
    image: intelligent-sharepoint-parsing_worker:latest
    profiles: ["build-only"]
    build:
      context: .
      dockerfile: src/services/parser_service/Dockerfile.worker
    restart: always
    environment:
      - ENV=production
    env_file:
      - ./.env
    volumes:
      - ./data:/app/data

  registry:
    image: registry:2
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry

  nfs:
    image: rclone/rclone:1.73
    container_name: docspace-nfs
    restart: always
    command:
      - serve
      - nfs
      - /data
      - --addr
      - 0.0.0.0:2049
      - --vfs-cache-mode
      - full
      - --vfs-write-back
      - 0s
      - --dir-cache-time
      - 1s
      - --nfs-cache-type
      - disk
      - --nfs-cache-dir
      - /nfs-cache/handles
      - --cache-dir
      - /nfs-cache
    volumes:
      - ./data:/data
      - nfs-cache:/nfs-cache
    networks:
      - default
      - kind

  web_app:
    build:
      context: ./src/app
      dockerfile: Dockerfile
    restart: always
    ports:
      - "4200:4200"
    environment:
      - ENV=production
    depends_on:
      - db
      - doc_manager_api

volumes:
  db-data:
  redis-data:
  registry-data:
  nfs-cache:

networks:
  kind:
    external: true
    name: kind