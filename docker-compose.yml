services:

  redis:
    image: "redis:alpine"
    container_name: redis-service
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  db:
    image: mysql
    restart: always
    env_file: 
      - ./.env
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    depends_on:
      - redis
  admin:
    image: phpmyadmin
    restart: always
    environment:
      - PMA_ARBITRARY=1
    ports:
      - 8080:80
    depends_on:
      - db
      - redis
  doc_manager_api:
    build:
      context: .
      dockerfile: src/services/doc_manager_service/Dockerfile
    restart: always
    environment:
      - ENV=production
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file: 
      - ./.env
  doc_manager_worker:
    build:
      context: .
      dockerfile: src/services/doc_manager_service/Dockerfile
    restart: always
    environment:
      - ENV=production
    command: ["python", "worker.py"]
    depends_on:
      - db
    env_file: 
      - ./.env
    volumes:
      - ./data:/app/data
      
volumes:
  db-data:
  redis-data: