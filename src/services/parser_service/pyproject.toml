[project]
name = "parser_service"
version = "0.1.0"
description = "Parser service for document parsing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "rq>=3.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]
worker = [
    "docling>=2.80.0",
    "openai>=2.0.0",
    "torch",
    "torchvision",
]
