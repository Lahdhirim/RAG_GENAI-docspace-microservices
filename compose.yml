services:
  db:
    image: mysql
    restart: always
    env_file: 
      - ./.env
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
  admin:
    image: phpmyadmin
    restart: always
    environment:
      - PMA_ARBITRARY=1
    ports:
      - 8080:80
    depends_on:
      - db
    
  doc_manager_api:
    build: services/doc_manager_service
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file: 
      - ./.env
      
volumes:
  db-data: