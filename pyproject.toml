[project]
name = "Docspace"
version = "0.1.0"
description = "Docspace project for managing document-related services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "shared"
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "ipykernel>=7.4.0",
    "pre-commit>=4.5.1",
    "ruff>=0.15.6",
]

[tool.uv.workspace]
members = [
    "src/services/parser_service",
    "src/services/doc_manager_service",
    "src/services/graph_rag_service",
    "src/shared"
]

[tool.uv.sources]
shared = { workspace = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
