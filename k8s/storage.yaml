apiVersion: v1
kind: PersistentVolume
metadata:
  name: docspace-shared-data
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - vers=3
    - proto=tcp
    - port=2049
    - mountport=2049
    - nolock
    - soft
    - timeo=50
    - retrans=3
  nfs:
    server: docspace-nfs
    path: /
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: parsing-worker-data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: docspace-shared-data
  resources:
    requests:
      storage: 100Gi
